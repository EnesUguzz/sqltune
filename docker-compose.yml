# vLLM OpenAI-compatible server for every local model in sqltune.
# Start with `make serve` (base model) or `make serve LORA=<adapter dir under adapters/>`.
# Training and this server cannot share the 16 GB GPU: `make serve-down` before `make train`.
services:
  vllm:
    image: vllm/vllm-openai:v0.31.0   # pinned; Blackwell (sm_120) + LoRA verified in M0 Task 1
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - ./adapters:/adapters:ro
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command: >
      --model ${MODEL:-Qwen/Qwen2.5-Coder-3B-Instruct}
      --served-model-name base
      --max-model-len ${MAX_MODEL_LEN:-4096}
      --gpu-memory-utilization ${GPU_UTIL:-0.80}
      --enable-lora
      --max-lora-rank 64
      ${LORA_ARGS:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
