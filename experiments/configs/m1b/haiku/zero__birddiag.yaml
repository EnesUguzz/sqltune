# Claude Haiku via claude -p (closed-model reference), zero-shot; from m1b--base__zero__birddiag.yaml
# model haiku | prompt variant zero | eval set birddiag
extends: ../../base.yaml
run:
  experiment_name: m1a
  run_name: m1_haiku__zero__birddiag
inference:
  model: haiku
  backend: claude_cli
  concurrency: 4
  timeout_s: 180
  max_retries: 2
data:
  dataset: bird
  bird_split: diag
evaluation:
  row_compare: set
  exec_timeout_s: 30.0
