# M1b main run: Spider train + BIRD train, from the base model (not on top of m0_qlora).
# Everything else as m0/qlora.yaml (r 16, alpha 16, lr 2e-4, effective batch 16).
# Stop vLLM first (`make serve-down`), then `make train CONFIG=experiments/configs/m1b/train/mix.yaml`.
extends: ../../m0/qlora.yaml

run:
  experiment_name: m1b
  run_name: m1b_mix

data:
  train_sources: [spider, bird]   # 7000 + BIRD train minus world/airline and failing gold
  spider_train_exclude_dbs: [formula_1, soccer_1]   # same data as BIRD Mini-Dev DBs

training:
  num_train_epochs: 1             # M1a: 1 epoch ~ 2 epochs on Spider (lc_f1 77.3 vs m0 76.8)
  max_seq_length: 8192            # keeps every record (BIRD plain max 6803; rows fall back)
  per_device_train_batch_size: 2  # long records: 2 x 8 keeps effective batch 16
  gradient_accumulation_steps: 8
  val_fraction: 0.05              # whole databases, per source
  eval_steps: 100
  train_sample_rows_mix: 0.5      # half the records show 3 example rows (rows3 eval variant)
